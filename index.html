<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#191b20">
  <meta name="description" content="一家人、一台设备，口述提示、手动换队的行动代号游戏。支持安装到桌面和离线游玩。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="行动代号">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <title>行动代号 · 家庭桌</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #191b20;
      --panel: #22252b;
      --line: #383b43;
      --text: #f4f0e9;
      --muted: #a5a5ac;
      --red: #f17d73;
      --blue: #83b7f5;
      --cream: #eee8dc;
      --neutral: #c9b998;
      --team: var(--red);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse at 12% 0%, #33302f 0, transparent 44%), var(--background);
      color: var(--text);
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
    button:disabled { cursor: default; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible {
      outline: 3px solid var(--blue);
      outline-offset: 4px;
    }
    button { touch-action: manipulation; }
    [hidden] { display: none !important; }
    .shell { width: min(1392px, 100%); padding: 30px 44px 22px; margin: 0 auto; }
    .header { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 34px; }
    .brand { display: flex; align-items: center; gap: 14px; }
    .brand-mark { width: 37px; height: 37px; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; transform: rotate(-7deg); }
    .brand-mark i { border-radius: 3px; background: var(--cream); }
    .brand-mark i:nth-child(2) { background: var(--red); }
    .brand-mark i:nth-child(3) { background: var(--blue); }
    .brand-mark i:nth-child(4) { background: #45484e; }
    h1 { font-size: 25px; letter-spacing: 3px; margin: 0; font-weight: 800; }
    .brand-subtitle { color: var(--muted); font-size: 10px; letter-spacing: 3px; margin-top: 6px; }
    .header-actions { display: flex; gap: 8px; align-items: center; }
    .button { border: 1px solid var(--line); color: var(--text); background: #ffffff05; border-radius: 10px; padding: 11px 16px; font-weight: 600; font-size: 13px; transition: background .15s, transform .15s; }
    .button:hover:not(:disabled) { background: #ffffff0d; }
    .button:active:not(:disabled) { transform: translateY(1px); }
    .button:disabled { opacity: .4; }
    .button.primary { background: var(--cream); color: #26282d; border-color: var(--cream); }
    .button.primary:hover:not(:disabled) { background: #fff6e5; }
    .button.team { color: #171b22; background: var(--team); border-color: var(--team); }
    .button.team:hover:not(:disabled) { filter: brightness(1.07); background: var(--team); }
    .button.full { width: 100%; padding: 15px 12px; font-size: 14px; }
    .button.quiet { border-color: transparent; color: var(--muted); }
    .button.quiet:hover { color: var(--text); }
    .offline { color: var(--muted); font-size: 11px; white-space: nowrap; display: flex; gap: 7px; align-items: center; margin-right: 9px; }
    .offline::before { content: ""; width: 6px; height: 6px; background: #a4bda0; border-radius: 50%; }
    .pwa-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    .pwa-actions .button { font-size: 11px; padding: 7px 9px; }
    .offline-status-mobile { display: none; }
    .scoreboard { display: grid; grid-template-columns: 1fr auto 1fr; gap: 24px; align-items: center; margin-top: 24px; }
    .score { border: 1px solid var(--line); border-radius: 14px; background: #ffffff03; min-height: 88px; display: flex; gap: 20px; align-items: center; padding: 15px 22px; transition: border-color .2s; }
    .score.red { --score-color: var(--red); }
    .score.blue { --score-color: var(--blue); }
    .score.active { border-color: var(--score-color); background: color-mix(in srgb, var(--score-color) 7%, transparent); }
    .score-icon { width: 35px; height: 35px; border-radius: 50%; border: 1px solid color-mix(in srgb, var(--score-color) 40%, transparent); color: var(--score-color); display: grid; place-items: center; }
    .score-icon svg { width: 21px; height: 21px; }
    .score-description { flex: 1; }
    .score-label { color: var(--score-color); font-size: 14px; font-weight: 700; letter-spacing: 2px; }
    .score-note { font-size: 11px; margin-top: 6px; color: var(--muted); }
    .score-remaining { font-size: 33px; font-weight: 750; color: var(--score-color); font-variant-numeric: tabular-nums; line-height: 1; }
    .score-remaining small { display: block; font-size: 10px; color: var(--muted); font-weight: 400; margin-top: 8px; text-align: center; }
    .turn-indicator { text-align: center; min-width: 106px; }
    .eyebrow { font-size: 10px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; }
    .turn-label { margin-top: 9px; font-size: 15px; color: var(--team); font-weight: 650; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 292px; gap: 28px; align-items: start; }
    .board-heading { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 18px; min-height: 43px; }
    .board-heading h2 { font-size: 23px; font-weight: 650; letter-spacing: 1px; margin: 0; }
    .board-heading p { font-size: 12px; color: var(--muted); margin: 7px 0 0; }
    .view-badge { border: 1px solid var(--line); border-radius: 7px; font-size: 11px; padding: 9px 11px; color: #c6c6cc; white-space: nowrap; }
    .view-badge.secret { color: var(--team); border-color: color-mix(in srgb, var(--team) 50%, transparent); }
    .mobile-briefing { display: none; }
    .board { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
    .card {
      position: relative; min-width: 0; height: clamp(95px, 8.4vw, 125px); border: 1px solid #f7f0e3;
      border-radius: 10px; padding: 24px 4px 23px; color: #302f30;
      background: linear-gradient(145deg, #f5efe3, #e5ddcf);
      box-shadow: 0 4px 0 #b9af9f, 0 7px 14px #0002;
      display: flex; align-items: center; justify-content: center;
      transition: transform .16s, box-shadow .16s, filter .16s;
      user-select: none; overflow: hidden;
    }
    .card:not(:disabled):hover { transform: translateY(-3px); box-shadow: 0 6px 0 #b9af9f, 0 12px 19px #0003; }
    .card:not(:disabled):active { transform: translateY(2px); box-shadow: 0 1px 0 #b9af9f; }
    .card-word { font-size: clamp(19px, 2vw, 28px); letter-spacing: 2px; font-weight: 750; line-height: 1.15; overflow-wrap: anywhere; }
    .card-word.long { font-size: clamp(15px, 1.6vw, 21px); letter-spacing: 1px; }
    .card-number { position: absolute; top: 10px; left: 12px; color: #948b7c; font-size: 9px; font-weight: 500; letter-spacing: 1px; }
    .card-role { position: absolute; bottom: 9px; font-size: 10px; font-weight: 600; letter-spacing: 2px; }
    .card-stamp { position: absolute; top: 9px; right: 10px; width: 14px; height: 14px; display: grid; place-items: center; font-size: 12px; }
    .card.role-red { background: linear-gradient(140deg, #f4a196, #d96c63); border-color: #f2a092; box-shadow: 0 4px 0 #a94e49, 0 7px 14px #0002; color: #401e21; }
    .card.role-blue { background: linear-gradient(140deg, #a6cbf4, #77a7df); border-color: #a4c9f3; box-shadow: 0 4px 0 #426ea6, 0 7px 14px #0002; color: #142d4d; }
    .card.role-neutral { background: linear-gradient(140deg, #cabea6, #ad9f88); border-color: #cbbfa7; box-shadow: 0 4px 0 #7e725f, 0 7px 14px #0002; color: #3c352c; }
    .card.role-assassin { background: linear-gradient(140deg, #36383e, #25262b); border-color: #777177; box-shadow: 0 4px 0 #101114, 0 7px 14px #0002; color: #f2ede4; }
    .card[class*="role-"] .card-number { color: currentColor; opacity: .6; }
    .card.revealed { filter: saturate(.65); box-shadow: 0 2px 0 #0007; }
    .card.revealed .card-word { opacity: .76; }
    .board.covered .card-word, .board.covered .card-number { visibility: hidden; }
    .family-rule { display: flex; align-items: center; justify-content: space-between; gap: 12px; border: 1px solid var(--line); border-radius: 10px; margin-top: 21px; padding: 14px 17px; font-size: 12px; color: #bab9bd; }
    .family-rule strong { color: #e3dccf; font-weight: 600; }
    .family-rule .rule-symbol { margin-right: 7px; color: var(--neutral); font-size: 15px; }
    .legend { display: flex; gap: 15px; font-size: 10px; white-space: nowrap; }
    .legend span { display: flex; align-items: center; gap: 5px; }
    .legend i { display: inline-block; height: 6px; width: 6px; border-radius: 2px; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
    .briefing { padding: 22px; }
    .panel-kicker { display: flex; justify-content: space-between; gap: 10px; color: var(--muted); font-size: 10px; letter-spacing: 2px; padding-bottom: 19px; }
    .live-dot { height: 6px; width: 6px; background: var(--team); border-radius: 50%; display: inline-block; margin-right: 6px; }
    .panel-title { font-size: 21px; margin: 0 0 9px; font-weight: 650; }
    .panel-copy { color: var(--muted); font-size: 12px; line-height: 1.8; margin: 0 0 20px; }
    .field-label { font-size: 12px; display: block; color: #cdcbd0; margin-bottom: 9px; }
    .input { width: 100%; color: var(--text); background: #191b20; border: 1px solid #4c4e58; padding: 13px 12px; border-radius: 8px; font-size: 14px; }
    .input::placeholder { color: #8f8e99; }
    .hint { font-size: 11px; color: var(--muted); line-height: 1.75; margin: 12px 0 0; }
    .error { color: #ffa99e; margin: 0 0 13px; line-height: 1.6; font-size: 12px; }
    .history { border-top: 1px solid var(--line); padding: 20px 22px 10px; }
    .history-title { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 11px; margin-bottom: 15px; }
    .history-list { max-height: 200px; overflow: auto; scrollbar-width: thin; }
    .history-empty { font-size: 11px; line-height: 1.8; color: #91929b; padding-bottom: 13px; }
    .history-turn { border-left: 2px solid var(--line); padding-left: 12px; margin-bottom: 16px; }
    .history-turn.red { border-color: var(--red); }
    .history-turn.blue { border-color: var(--blue); }
    .history-heading { font-size: 12px; font-weight: 650; margin-bottom: 7px; }
    .history-heading small { color: var(--muted); font-weight: 400; font-size: 10px; margin-left: 7px; }
    .history-guesses { display: flex; flex-wrap: wrap; gap: 5px; }
    .history-guess { border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; font-size: 10px; color: var(--muted); }
    .history-guess.red { color: var(--red); }
    .history-guess.blue { color: var(--blue); }
    .history-guess.neutral { color: var(--neutral); }
    .history-guess.assassin { color: #f4f0e9; }
    .footer { display: flex; justify-content: space-between; color: #8f9099; margin-top: 27px; font-size: 10px; letter-spacing: 1px; }
    .modal-backdrop { position: fixed; z-index: 10; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; background: #101216c9; backdrop-filter: blur(9px); overflow: auto; }
    .modal { position: relative; width: min(464px, 100%); max-height: calc(100dvh - 48px); overflow: auto; padding: 31px; border-radius: 19px; background: #25272d; border: 1px solid #4a4b50; box-shadow: 0 30px 100px #0006; }
    .modal.wide { width: min(580px, 100%); }
    .modal-close { position: absolute; top: 15px; right: 15px; border: 0; background: transparent; color: var(--muted); height: 30px; width: 30px; font-size: 24px; line-height: 1; border-radius: 7px; }
    .modal-close:hover { background: #ffffff0c; color: var(--text); }
    .modal-icon { width: 51px; height: 51px; display: grid; place-items: center; color: var(--team); border: 1px solid color-mix(in srgb, var(--team) 40%, transparent); border-radius: 14px; background: color-mix(in srgb, var(--team) 7%, transparent); margin-bottom: 21px; }
    .modal-icon svg { width: 27px; height: 27px; }
    .modal h2 { font-size: 27px; line-height: 1.35; margin: 10px 0 13px; letter-spacing: 1px; }
    .modal-copy { color: #b8b6bf; font-size: 13px; line-height: 1.9; margin: 0 0 24px; }
    .modal-footnote { font-size: 11px; color: var(--muted); line-height: 1.75; text-align: center; margin: 13px 0 0; }
    .modal-actions { display: flex; gap: 10px; }
    .modal-actions .button { flex: 1; }
    .handoff-steps { display: flex; flex-direction: column; gap: 13px; padding: 17px; margin: 21px 0 24px; border: 1px solid var(--line); background: #191b2033; border-radius: 10px; }
    .handoff-steps div { display: flex; gap: 11px; font-size: 12px; color: #c5c2ca; line-height: 1.6; }
    .handoff-steps span { color: var(--team); font-size: 10px; font-variant-numeric: tabular-nums; }
    .setup-section { margin: 23px 0; }
    .segmented { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
    .segmented button { font-size: 12px; padding: 11px 6px; border-radius: 8px; background: #1d1f24; border: 1px solid var(--line); color: #bdbac5; }
    .segmented button.selected { border-color: var(--cream); color: var(--cream); background: #efe8db0d; }
    .setup-info { display: flex; gap: 10px; align-items: center; font-size: 12px; padding: 14px; border: 1px solid var(--line); border-radius: 9px; background: #191b2055; margin: 20px 0; }
    .setup-info strong { color: var(--cream); }
    .setup-info span { color: var(--muted); line-height: 1.6; }
    .word-bank-list { display: grid; gap: 9px; margin: 22px 0; }
    .word-bank-option { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px; text-align: left; }
    .word-bank-option.selected { border-color: var(--cream); background: #efe8db0d; }
    .word-bank-name { display: block; overflow-wrap: anywhere; }
    .word-bank-count { display: block; color: var(--muted); font-size: 11px; font-weight: 400; margin-top: 7px; }
    .word-bank-choice { color: var(--muted); flex-shrink: 0; font-size: 11px; }
    .word-bank-field { margin: 20px 0; }
    .word-bank-field textarea { resize: vertical; min-height: 150px; line-height: 1.7; }
    .rules { padding: 0; margin: 23px 0; list-style: none; display: flex; flex-direction: column; gap: 17px; }
    .rules li { display: flex; gap: 13px; }
    .rules .rule-index { color: var(--team); font-size: 11px; padding-top: 3px; }
    .rules strong { font-size: 13px; color: #f4f0e9; display: block; margin-bottom: 5px; }
    .rules p { font-size: 12px; color: #b3b0bb; line-height: 1.85; margin: 0; }
    .rules-highlight { border: 1px solid #796d58; color: #e2d6bd; background: #cab9980b; padding: 14px 15px; border-radius: 9px; font-size: 12px; line-height: 1.8; }
    .selection-word { background: var(--cream); color: #302f30; border-radius: 10px; padding: 24px 16px; text-align: center; font-weight: 750; letter-spacing: 3px; font-size: 32px; margin: 21px 0; }
    .result-statistics { display: flex; border: 1px solid var(--line); border-radius: 10px; margin: 23px 0; padding: 18px; justify-content: space-around; text-align: center; }
    .result-statistics strong { display: block; font-size: 25px; color: var(--team); }
    .result-statistics span { display: block; font-size: 10px; color: var(--muted); margin-top: 7px; }
    .toast { position: fixed; z-index: 20; left: 50%; bottom: max(28px, env(safe-area-inset-bottom)); transform: translateX(-50%); max-width: calc(100% - 36px); width: max-content; padding: 14px 21px; border: 1px solid #777078; border-radius: 12px; background: #2c2d34; color: #f4efe7; box-shadow: 0 8px 28px #0005; font-size: 13px; text-align: center; line-height: 1.6; pointer-events: none; }
    @media (min-width: 1500px) { .card { height: 125px; } }
    @media (max-width: 1100px) {
      .shell { padding: 25px 25px 20px; }
      .layout { grid-template-columns: minmax(0, 1fr) 260px; gap: 21px; }
      .board { gap: 9px; }
      .card { height: 100px; }
      .briefing { padding: 19px; }
      .history { padding: 18px 19px 9px; }
      .legend { display: none; }
    }
    @media (min-width: 851px) and (max-width: 1100px) {
      .scoreboard { gap: 14px; }
      .score { gap: 12px; padding: 14px; }
      .score-icon { display: none; }
    }
    @media (max-width: 850px) {
      .layout { grid-template-columns: 1fr; gap: 22px; }
      .mobile-briefing { display: flex; position: sticky; top: 8px; z-index: 2; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; padding: 11px 13px; border: 1px solid var(--line); border-radius: 9px; background: #25272d; font-size: 12px; box-shadow: 0 4px 12px #0002; }
      .mobile-briefing strong { color: var(--team); font-weight: 650; }
      .mobile-briefing button { color: var(--team); background: transparent; border: 0; padding: 0; font-size: 12px; }
      .panel { display: grid; grid-template-columns: 1fr 1fr; }
      .history { border-top: 0; border-left: 1px solid var(--line); padding: 22px; }
      .history-list { max-height: 280px; }
      .card { height: 110px; }
      .card-word { font-size: 26px; }
      .card-word.long { font-size: 20px; }
      .board-heading h2 { font-size: 22px; }
      .header { margin-bottom: 26px; }
      .offline { display: none; }
      .offline-status-mobile { display: inline; }
      .scoreboard { gap: 14px; }
      .score { gap: 12px; padding: 14px; }
    }
    @media (max-width: 540px) {
      .shell { padding: 19px 14px 18px; }
      .header { gap: 10px; margin-bottom: 23px; }
      .brand { gap: 9px; }
      .brand-mark { width: 27px; height: 27px; gap: 3px; }
      h1 { font-size: 20px; letter-spacing: 2px; }
      .brand-subtitle { font-size: 8px; letter-spacing: 1.5px; }
      .header-actions { gap: 1px; }
      .header-actions .button { padding: 9px 8px; font-size: 11px; }
      #fullscreen-button { display: none; }
      .scoreboard { gap: 8px; grid-template-columns: 1fr 65px 1fr; margin-top: 21px; }
      .score { padding: 12px 10px; gap: 6px; min-height: 75px; border-radius: 10px; }
      .score-icon { display: none; }
      .score-label { font-size: 12px; letter-spacing: 1px; }
      .score-note { font-size: 9px; margin-top: 7px; }
      .score-remaining { font-size: 28px; }
      .score-remaining small { font-size: 8px; }
      .turn-indicator { min-width: 0; }
      .eyebrow { font-size: 8px; letter-spacing: 1px; }
      .turn-label { font-size: 11px; margin-top: 7px; }
      .board-heading { gap: 8px; margin-bottom: 14px; }
      .board-heading h2 { font-size: 19px; letter-spacing: 0; }
      .board-heading p { font-size: 10px; }
      .view-badge { font-size: 9px; padding: 7px; }
      .board { gap: 7px; }
      .card { height: 76px; padding: 20px 2px 21px; border-radius: 7px; box-shadow: 0 3px 0 #b9af9f; }
      .card-word { font-size: 17px; letter-spacing: 0; }
      .card-word.long { font-size: 13px; letter-spacing: 0; }
      .card-number { top: 7px; left: 7px; font-size: 7px; letter-spacing: 0; }
      .card-role { bottom: 7px; font-size: 8px; letter-spacing: 0; }
      .card-stamp { top: 6px; right: 6px; font-size: 9px; }
      .family-rule { padding: 12px; font-size: 10px; margin-top: 17px; line-height: 1.8; }
      .family-rule .rule-symbol { margin-right: 4px; }
      .panel { display: block; }
      .history { border-left: 0; border-top: 1px solid var(--line); padding: 19px; }
      .history-list { max-height: 170px; }
      .briefing { padding: 20px; }
      .panel-kicker { padding-bottom: 15px; }
      .panel-title { font-size: 20px; }
      .panel-copy { margin-bottom: 14px; }
      .footer { font-size: 8px; letter-spacing: 0; gap: 10px; margin-top: 21px; }
      .modal-backdrop { padding: 15px; }
      .modal { padding: 25px; max-height: calc(100dvh - 30px); border-radius: 15px; }
      .modal h2 { font-size: 24px; }
      .modal-icon { width: 44px; height: 44px; margin-bottom: 18px; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <div class="shell">
    <header class="header">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        <div><h1>行动代号</h1><div class="brand-subtitle">CODENAMES / 家庭桌</div></div>
      </div>
      <nav class="header-actions" aria-label="游戏菜单">
        <span class="offline" id="offline-status" data-offline-status role="status" aria-live="polite">离线就绪</span>
        <button class="button quiet" id="rules-button">玩法</button>
        <button class="button quiet" id="word-banks-button">词库</button>
        <button class="button quiet" id="fullscreen-button">全屏</button>
        <button class="button" id="new-game-button">新对局 ↗</button>
      </nav>
    </header>
    <main class="layout">
      <section aria-label="代号棋盘">
        <div class="board-heading">
          <div><h2 id="board-title">寻找你的同伴。</h2><p id="board-description">一个词，连接彼此的脑回路。</p></div>
          <span class="view-badge" id="view-badge">公共视角</span>
        </div>

        const shuffled = [...items];

          const swapIndex = Math.floor(random() * (index + 1));

      function saveWordBank() {

        else if (name === "默认词库" || wordBanks.some(bank => bank.name === name)) message = "这个词库名称已存在，请换个名字。";
        else if (words.length < 25) message = `目前只有 ${words.length} 个不同的词，请补充到至少 25 个。`;
        else if (words.some(word => [...word].length > 8)) message = "每个词请控制在 8 个字以内，方便在棋盘上显示。";
        if (message) {
          error.textContent = message;
          error.hidden = false;
          return;
        }
        const updatedBanks = [...wordBanks, { name, words }];
        try { localStorage.setItem(WORD_BANKS_STORAGE_KEY, JSON.stringify(updatedBanks)); }

          console.info("浏览器未能保存词库。", storageError.name);

          if (document.fullscreenElement) await document.exitFullscreen();
          else await document.documentElement.requestFullscreen();
        } catch (error) { showToast("这个浏览器暂不支持全屏，可以用浏览器菜单放大窗口。"); }
      });
      document.addEventListener("fullscreenchange", () => {
        document.getElementById("fullscreen-button").textContent = document.fullscreenElement ? "退出全屏" : "全屏";
      });
      document.addEventListener("visibilitychange", () => { if (document.hidden) lockKey(); });
      window.addEventListener("blur", () => lockKey());
      document.addEventListener("keydown", event => {
        if (!modalKind) return;
        if (event.key === "Escape" && modalKind === "word-bank-editor") {
          event.preventDefault(); showWordBanks(wordBankReturnToSetup); return;
        }
        if (event.key === "Escape" && modalKind === "word-banks") {
          event.preventDefault(); returnFromWordBanks(); return;
        }
        if (event.key === "Escape" && ["setup", "rules", "selection", "result", "install"].includes(modalKind)) {
          event.preventDefault(); closeModal();
          if (game?.phase === "key" && privacyLocked) showKeyConfirmation();
        }
        if (event.key === "Tab") {
          const focusable = [...elements.modal.querySelectorAll('button:not(:disabled), input, select, textarea, summary')].filter(node => node.getClientRects().length);
          const first = focusable[0], last = focusable[focusable.length - 1];
          if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last?.focus(); }
          else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first?.focus(); }
        }
      });
      render();
      if (game) {
        saveGame();
        if (game.phase === "key") showKeyConfirmation();
        else if (game.phase === "finished") showResult();
        else showToast("已恢复这台设备上的对局，继续行动吧。");
      }
    })();
  </script>
  <script src="./pwa.js"></script>
</body>
</html>
